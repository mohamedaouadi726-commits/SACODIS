.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:22px}.bar select,.bar input{border:1px solid var(--line);background:var(--card);padding:6px 10px;border-radius:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);cursor:pointer}.ph{display:grid;place-items:center;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover}
.card .ph{aspect-ratio:1;background:var(--soft);font-size:64px}.card .i{padding:12px 14px}.st{color:var(--acc);letter-spacing:2px}.mut{color:var(--mut);font-size:13px}
.rv{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.rv>div{border:1px solid var(--line);background:var(--card);padding:26px}.eb{display:inline-flex;align-items:center;gap:10px;color:var(--acc);font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:10px}.eb i{width:26px;height:1px;background:var(--acc)}.au{display:flex;align-items:center;gap:12px;margin-top:20px;font-size:14px}.av{width:38px;height:38px;border-radius:50%;background:var(--fg);color:var(--acc);display:grid;place-items:center;font-family:Georgia,serif;font-weight:700}
.ov{position:fixed;inset:0;background:#0007;z-index:20;display:none;justify-content:flex-end}.ov.c{justify-content:center;align-items:center}.ov.on{display:flex}
.pn{background:var(--bg);width:min(420px,100%);height:100%;overflow:auto;padding:24px}.ov.c .pn{height:auto;max-height:92%;width:min(560px,94%);border:1px solid var(--line)}
.pn label,section label{display:block;margin:10px 0 3px;font-size:13px;color:var(--mut)}
.pn input,.pn textarea,.pn select,section .w{width:100%;border:1px solid var(--line);background:var(--card);padding:8px 10px;border-radius:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.prog{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin:10px 0}.prog i{display:block;height:100%;background:var(--acc)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 22px;z-index:30;display:none;max-width:90%;text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.tabs .btn{opacity:.55}.tabs .btn.on{opacity:1}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}td,th{padding:8px;text-align:start;border-bottom:1px solid var(--line);font-size:14px}
footer{text-align:center;color:var(--mut);padding:30px;border-top:1px solid var(--line);font-size:13px}
</style></head>

async function cload(){const{data:{session}}=await db.auth.getSession();CU=null;if(!session)return;const u=session.user;
let{data}=await db.from('gb_customers').select('*').eq('user_id',u.id).maybeSingle();
if(!data){const m=u.user_metadata||{};if(m.first_name){const r=await db.from('gb_customers').insert({user_id:u.id,first_name:m.first_name,last_name:m.last_name||'',email:u.email,phone:m.phone||''}).select().maybeSingle();data=r.data}}
CU=data||{email:u.email}}
async function acct(){await cload();CU?showCard():authForm('in')}
function authForm(m){const up=m=='up';ov(`<h2>${t('loyh')}</h2>${up?`<label>${t('fn')}</label><input id="a1" maxlength="50"><label>${t('ln')}</label><input id="a2" maxlength="50"><label>${t('phone')}</label><input id="a3" inputmode="tel" dir="ltr">`:''}<label>${t('email')}</label><input id="ae" type="email" dir="ltr"><label>${t('pass')}</label><input id="ap" type="password" dir="ltr"><p><button class="btn" onclick="${up?'signUp()':'signIn()'}">${t(up?'signup':'signin')}</button></p><p><a class="lk" onclick="authForm('${up?'in':'up'}')">${t(up?'haveacc':'newacc')}</a></p>`,1)}
async function signUp(){const fn=$('#a1').value.trim(),ln=$('#a2').value.trim(),ph=$('#a3').value.trim(),email=$('#ae').value.trim(),password=$('#ap').value;
if(!fn||!ln||!/^[0-9+ ]{8,16}$/.test(ph)||!email||password.length<8)return toast(t('invalid'));
const{data,error}=await db.auth.signUp({email,password,options:{data:{first_name:fn,last_name:ln,phone:ph}}});if(error)return toast(error.message);
if(data.session)acct();else{closeOv();toast(t('confirm'))}}
async function signIn(){const{error}=await db.auth.signInWithPassword({email:$('#ae').value.trim(),password:$('#ap').value});
if(error)return toast(/confirm/i.test(error.message)?t('confirm'):t('badlogin'));acct()}
async function signOut(){await db.auth.signOut();CU=null;closeOv()}
async function showCard(){const[l,o]=await Promise.all([db.rpc('gb_my_loyalty'),CU.user_id?db.from('gb_orders').select('id,status,total,created_at,items').eq('user_id',CU.user_id).order('created_at',{ascending:false}).limit(20):{data:[]}]),n=l.data||0,d=Math.min(n,10);
ov(`<h2>${t('loyh')}</h2><div class="card" style="padding:16px;cursor:default"><b>${esc(CU.first_name)} ${esc(CU.last_name)}</b><br><span class="mut" dir="ltr">${esc(CU.email)}</span><p><b>${d} / 10 ${t('done')}</b></p><div class="prog"><i style="width:${d*10}%"></i></div><p>${n>=10?t('next10'):t('more').replace('{n}',10-d)}</p></div>
<h3 style="font-weight:400">${t('myorders')}</h3>${(o.data||[]).map(r=>`<div class="row"><span>${new Date(r.created_at).toLocaleDateString()}<br><span class="mut">${dt(r.total)}</span><br>${(r.items||[]).map(x=>pf(x.id)?`<span class="ph" style="display:inline-grid;width:36px;height:36px;font-size:18px;background:var(--soft);margin:4px 4px 0 0">${pic(pf(x.id))}</span>`:'').join('')}</span><b>${t(r.status)}</b></div>`).join('')||`<p class="mut">${t('noorders')}</p>`}<p><button class="btn o sm" onclick="signOut()">${t('logout')}</button></p>`,1)}
/* ====== ADMIN (English UI; Supabase Auth + RLS enforce access) ====== */
var sEmail='',aErr='';async function aload(){const{data:{session}}=await db.auth.getSession();isAdmin=false;sEmail=session?.user?.email||'';aErr='';if(session){const r=await db.rpc('gb_is_admin');isAdmin=r.data===true;if(r.error)aErr=r.error.message}
if(isAdmin){const[o,p,r]=await Promise.all([db.from('gb_orders').select('*').order('created_at',{ascending:false}),db.from('gb_products').select('*').order('created_at'),db.from('gb_reviews').select('*').order('created_at',{ascending:false})]);AD={o:o.data||[],p:p.data||[],r:r.data||[]}}render()}
async function login(){const{error}=await db.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});if(error)return toast('Échec de la connexion : '+error.message);aload()}
async function logout(){await db.auth.signOut();isAdmin=false;go('shop')}
const TL={orders:'Commandes',products:'Produits',reviews:'Avis',content:'Contenu'},SL={pending:'En attente',shipped:'Expédiée',delivered:'Livrée',canceled:'Annulée'},ML={delivery:'Livraison',pickup:'Retrait'};
function admin(){if(!isAdmin)return `<section class="s" style="max-width:420px"><h2>Connexion admin</h2>${sEmail?`<p>Connecté en tant que <b>${esc(sEmail)}</b>, mais ce compte n’est pas encore administrateur.${aErr?' (erreur : '+esc(aErr)+')':''} Exécutez ceci dans le SQL Editor de Supabase, puis rechargez :</p><p><code>insert into gb_admins select id from auth.users where email='${esc(sEmail)}';</code></p><p><button class="btn o sm" onclick="logout()">Se déconnecter</button></p>`:''}<label>E-mail</label><input class="w" id="em" type="email" dir="ltr"><label>Mot de passe</label><input class="w" id="pw" type="password" dir="ltr"><p><button class="btn" onclick="login()">Se connecter</button></p></section>`;
const T=['orders','products','reviews','content'];let b='';
if(tab=='orders')b=`<div class="tw"><table><tr><th>Client</th><th>Téléphone</th><th>Mode</th><th>Total</th><th>Statut</th></tr>${AD.o.map(o=>`<tr><td>${esc(o.first_name)} ${esc(o.last_name)}<br><span class="mut">${new Date(o.created_at).toLocaleString('fr-FR')}${o.address?'<br>'+esc(o.address):''}</span></td><td dir="ltr">${esc(o.phone)}</td><td>${ML[o.mode]}<br><span class="mut">Paiement à la livraison${o.discount?' · fidélité −10 %':''}</span></td><td>${Number(o.total).toFixed(2)} DT</td><td><select onchange="setSt('${o.id}',this.value)">${['pending','shipped','delivered','canceled'].map(s=>`<option value="${s}" ${s==o.status?'selected':''}>${SL[s]}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan=5 class="mut">Aucune commande.</td></tr>'}</table></div>`;
if(tab=='products')b=`<p><button class="btn" onclick="edP()">+ Ajouter un produit</button></p><div class="tw"><table><tr><th></th><th>Produit</th><th>Prix</th><th>Catégorie</th><th></th></tr>${AD.p.map(p=>`<tr><td style="width:56px"><div class="ph" style="width:48px;height:48px;font-size:26px;background:var(--soft)">${pic(p)}</div></td><td>${esc(p.title)}${p.active?'':' <span class="mut">(masqué)</span>'}</td><td>${Number(p.price).toFixed(2)} DT</td><td>${esc(p.category)}</td><td><button class="btn o sm" onclick="edP('${p.id}')">Modifier</button> <button class="btn o sm" onclick="delP('${p.id}')">Supprimer</button></td></tr>`).join('')}</table></div>`;
if(tab=='reviews')b=AD.r.map(r=>`<div class="row"><span><span class="st">${stars(r.rating)}</span> ${esc(r.name)} sur ${esc(pf(r.product_id)?.title||'Boutique')}<br>${esc(r.comment)}</span><span>${r.approved?'<span class="mut">approuvé</span>':`<button class="btn sm" onclick="rv('${r.id}',1)">Approuver</button>`} <button class="btn o sm" onclick="rv('${r.id}',0)">Supprimer</button></span></div>`).join('')||'<p class="mut">Aucun avis.</p>';
if(tab=='content')b='<p class="mut">Si un champ FR ou AR est vide, le texte anglais (EN) est utilisé.</p>'+[['promo','Bannière promo'],['hero_title','Titre de l’accueil'],['hero_sub','Sous-titre de l’accueil'],['story','Notre histoire']].map(([k,l])=>`<label>${l}</label>`+['_fr','','_ar'].map(s=>k=='story'?`<textarea class="w" rows="4" data-k="${k+s}" placeholder="${s?s.slice(1).toUpperCase():'EN'}" ${s=='_ar'?'dir="rtl"':''}>${esc(C[k+s])}</textarea>`:`<input class="w" data-k="${k+s}" placeholder="${s?s.slice(1).toUpperCase():'EN'}" value="${esc(C[k+s])}" ${s=='_ar'?'dir="rtl"':''}>`).join('')).join('')+`<p><button class="btn" onclick="saveC()">Enregistrer</button></p>`;
return `<section class="s"><h2>Tableau de bord <button class="btn o sm" onclick="logout()">Se déconnecter</button></h2><div class="tabs">${T.map(x=>`<button class="btn ${x==tab?'on':''}" onclick="tab='${x}';render()">${TL[x]}</button>`).join('')}</div>${b}</section>`}
const ok=r=>{if(r.error){toast(r.error.message);return false}return true};
async function setSt(id,status){if(ok(await db.from('gb_orders').update({status}).eq('id',id)))toast('Statut mis à jour')}
async function delP(id){if(confirm('Supprimer ce produit ?')&&ok(await db.from('gb_products').delete().eq('id',id))){await load();aload()}}
function edP(id){const p=id?pf(id):{};ov(`<h2>${id?'Modifier le produit':'Nouveau produit'}</h2><div class="ph" id="pvw" style="aspect-ratio:16/9;background:var(--soft);font-size:60px">${id?pic(p):'🖼️'}</div><label>Photo (depuis votre appareil)</label><input type="file" id="ef" accept="image/*" onchange="prevImg(this)">
<label>Titre (EN)</label><input id="e1" value="${esc(p.title)}"><label>Description (EN)</label><textarea id="e2" rows="3">${esc(p.description)}</textarea><label>Prix (DT)</label><input id="e3" type="number" step="0.01" value="${esc(p.price)}"><label>Catégorie</label><input id="e4" value="${esc(p.category)}"><label>Emoji (affiché sans photo)</label><input id="e5" value="${esc(p.emoji||'🎁')}" maxlength="4">
<label>Titre (FR)</label><input id="e6" value="${esc(p.title_fr)}"><label>Description (FR)</label><textarea id="e7" rows="2">${esc(p.description_fr)}</textarea><label>Titre (AR)</label><input id="e8" dir="rtl" value="${esc(p.title_ar)}"><label>Description (AR)</label><textarea id="e9" rows="2" dir="rtl">${esc(p.description_ar)}</textarea>
<label><input type="checkbox" id="e0" ${p.active===false?'':'checked'} style="width:auto"> Visible dans la boutique</label><p><button class="btn" id="sv" onclick="saveP('${id||''}')">Enregistrer</button></p>`,1)}
function prevImg(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>$('#pvw').innerHTML=`<img src="${r.result}">`;r.readAsDataURL(f)}
function shrink(f){return new Promise(res=>{const im=new Image(),u=new FileReader();u.onload=()=>{im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(res,'image/jpeg',.82)};im.src=u.result};u.readAsDataURL(f)})}
async function saveP(id){const title=$('#e1').value.trim(),price=+$('#e3').value;if(!title||!(price>=0))return toast('Titre et prix obligatoires');
const v={title,description:$('#e2').value.trim(),price,category:$('#e4').value.trim()||'Other',emoji:$('#e5').value.trim()||'🎁',title_fr:$('#e6').value.trim()||null,description_fr:$('#e7').value.trim()||null,title_ar:$('#e8').value.trim()||null,description_ar:$('#e9').value.trim()||null,active:$('#e0').checked},f=$('#ef').files[0],btn=$('#sv');btn.disabled=true;
if(f){if(!f.type.startsWith('image/')){btn.disabled=false;return toast('Choisissez un fichier image')}const b=await shrink(f),path=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg',up=await db.storage.from('gb-products').upload(path,b,{contentType:'image/jpeg'});
if(up.error){btn.disabled=false;return toast(up.error.message)}v.image_url=db.storage.from('gb-products').getPublicUrl(path).data.publicUrl}
const r=id?await db.from('gb_products').update(v).eq('id',id):await db.from('gb_products').insert(v);btn.disabled=false;if(ok(r)){closeOv();await load();aload()}}
async function rv(id,yes){const r=yes?await db.from('gb_reviews').update({approved:true}).eq('id',id):await db.from('gb_reviews').delete().eq('id',id);if(ok(r)){await load();aload()}}
async function saveC(){const rows=[...document.querySelectorAll('[data-k]')].map(e=>({key:e.dataset.k,value:e.value}));if(ok(await db.from('gb_site_content').upsert(rows))){await load();toast('Contenu enregistré')}}
applyStatic();load();cload();
function hashNav(){if(location.hash=='#admin')go('admin')}
addEventListener('hashchange',hashNav);hashNav();
</script></body></html>
