async function delP(id){if(!confirm('Supprimer ce produit ?'))return;const r=await db.from('gb_products').delete().eq('id',id).select();if(!ok(r))return;if(!r.data.length)return toast('Suppression refusée par la base de données');AD.p=AD.p.filter(p=>p.id!=id);P=P.filter(p=>p.id!=id);R=R.filter(x=>x.product_id!=id);delete cart[id];render();toast('Produit supprimé avec succès')}
function edP(id){const p=id?pf(id):{};ov(`<h2>${id?'Modifier le produit':'Nouveau produit'}</h2><div class="ph" id="pvw" style="aspect-ratio:16/9;background:var(--soft);font-size:18px">${id?pic(p):'Aucune photo'}</div><label>Photo (depuis votre appareil)</label><input type="file" id="ef" accept="image/*" onchange="prevImg(this)">
<label>Titre (EN)</label><input id="e1" value="${esc(p.title)}"><label>Description (EN)</label><textarea id="e2" rows="3">${esc(p.description)}</textarea><label>Prix (DT)</label><input id="e3" type="number" step="0.01" value="${esc(p.price)}"><label>Catégorie</label><select id="e4"><option value="">— Aucune —</option>${AD.c.map(c=>`<option value="${c.id}" ${c.id==p.category_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>${AD.c.length?'':'<p class="mut">Créez d’abord une catégorie dans l’onglet Catégories.</p>'}
<label>Titre (FR)</label><input id="e6" value="${esc(p.title_fr)}"><label>Description (FR)</label><textarea id="e7" rows="2">${esc(p.description_fr)}</textarea><label>Titre (AR)</label><input id="e8" dir="rtl" value="${esc(p.title_ar)}"><label>Description (AR)</label><textarea id="e9" rows="2" dir="rtl">${esc(p.description_ar)}</textarea>
<label><input type="checkbox" id="e0" ${p.active===false?'':'checked'} style="width:auto"> Visible dans la boutique</label><p><button class="btn" id="sv" onclick="saveP('${id||''}')">Enregistrer</button></p>`,1)}
function prevImg(i,tg){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>$(tg||'#pvw').innerHTML=`<img src="${r.result}">`;r.readAsDataURL(f)}
function shrink(f){return new Promise(res=>{const im=new Image(),u=new FileReader();u.onload=()=>{im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(res,'image/jpeg',.82)};im.src=u.result};u.readAsDataURL(f)})}
async function saveP(id){const title=$('#e1').value.trim(),price=+$('#e3').value;if(!title||!(price>=0))return toast('Titre et prix obligatoires');
const v={title,description:$('#e2').value.trim(),price,category_id:$('#e4').value||null,category:(AD.c.find(c=>c.id==$('#e4').value)||{}).name||'Other',title_fr:$('#e6').value.trim()||null,description_fr:$('#e7').value.trim()||null,title_ar:$('#e8').value.trim()||null,description_ar:$('#e9').value.trim()||null,active:$('#e0').checked},f=$('#ef').files[0],btn=$('#sv');btn.disabled=true;
if(f){if(!f.type.startsWith('image/')){btn.disabled=false;return toast('Choisissez un fichier image')}const b=await shrink(f),path=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg',up=await db.storage.from('gb-products').upload(path,b,{contentType:'image/jpeg'});
if(up.error){btn.disabled=false;return toast(up.error.message)}v.image_url=db.storage.from('gb-products').getPublicUrl(path).data.publicUrl}
const r=id?await db.from('gb_products').update(v).eq('id',id):await db.from('gb_products').insert(v);btn.disabled=false;if(ok(r)){closeOv();await load();aload();toast('Produit enregistré avec succès')}}
async function rv(id,yes){const q=db.from('gb_reviews'),r=yes?await q.update({approved:true}).eq('id',id).select():await q.delete().eq('id',id).select();if(!ok(r))return;if(!r.data.length)return toast('Action refusée par la base de données');
if(yes){const x=AD.r.find(a=>a.id==id);if(x){x.approved=true;R=[x,...R.filter(a=>a.id!=id)]}}else{AD.r=AD.r.filter(a=>a.id!=id);R=R.filter(a=>a.id!=id)}render();toast(yes?'Avis approuvé avec succès':'Avis supprimé avec succès')}
async function saveC(){const rows=[...document.querySelectorAll('[data-k]')].map(e=>({key:e.dataset.k,value:e.value.trim()})),bad=rows.find(r=>['instagram','facebook'].includes(r.key)&&r.value&&!/^https:\/\//.test(r.value));if(bad)return toast('Le lien '+bad.key+' doit commencer par https://');
const sf=$('#sf')?.files[0];if($('#sx')?.checked)rows.push({key:'story_image',value:''});else if(sf){if(!sf.type.startsWith('image/'))return toast('Choisissez un fichier image');const b=await shrink(sf),path='story-'+Date.now()+'.jpg',up=await db.storage.from('gb-products').upload(path,b,{contentType:'image/jpeg'});if(up.error)return toast(up.error.message);rows.push({key:'story_image',value:db.storage.from('gb-products').getPublicUrl(path).data.publicUrl})}if(ok(await db.from('gb_site_content').upsert(rows))){await load();toast('Contenu enregistré avec succès')}}
applyStatic();load();cload();
function hashNav(){if(location.hash=='#admin')go('admin')}
addEventListener('hashchange',hashNav);hashNav();
setInterval(()=>{if(view=='admin'&&isAdmin&&tab=='orders'&&!$('#ov').classList.contains('on')&&!document.activeElement.matches('select'))aload()},30000);
