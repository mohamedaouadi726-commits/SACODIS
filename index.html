<title>Gift Boutique</title>
<style>
:root{--bg:#fafaf8;--fg:#1a1a1a;--mut:#6b6b66;--line:#e6e4df;--card:#fff;--soft:#f1efea;--acc:#a8814f;--on:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#121211;--fg:#f2f0ea;--mut:#a09d94;--line:#2c2b28;--card:#1b1a18;--soft:#22211e;--acc:#c9a272;--on:#121211}}
:root[data-theme=dark]{color-scheme:dark;--bg:#121211;--fg:#f2f0ea;--mut:#a09d94;--line:#2c2b28;--card:#1b1a18;--soft:#22211e;--acc:#c9a272;--on:#121211}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:15px/1.6 Georgia,serif}
html[lang=ar] body,html[lang=ar] button,html[lang=ar] input{font-family:'Segoe UI',Tahoma,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}.s{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 5vw;flex-wrap:wrap}
.logo{font-size:20px;letter-spacing:.18em;text-transform:uppercase;margin-inline-end:auto;cursor:pointer}
header nav{display:flex;gap:16px}.lk,header a{cursor:pointer;color:var(--mut);font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:none;border:0;padding:0}
.lk:hover,header a:hover{color:var(--fg)}#q,#lg{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px}#q{width:150px}#lg{padding:5px 8px}
.promo{background:var(--fg);color:var(--bg);text-align:center;padding:7px;font-size:12px;letter-spacing:.08em}
.hero{padding:12vh 5vw;text-align:center;background:linear-gradient(135deg,var(--soft),var(--bg))}

.btn{background:var(--fg);color:var(--bg);border:0;padding:12px 28px;border-radius:2px;cursor:pointer;letter-spacing:.1em;text-transform:uppercase;font-size:12px}
.btn.o{background:none;color:var(--fg);border:1px solid var(--fg)}.btn.a{background:var(--acc);color:var(--on)}.btn.sm{padding:6px 12px}.btn:disabled{opacity:.4}
section{padding:60px 5vw;max-width:1200px;margin:auto}h2{font-weight:400;font-size:28px;margin:0 0 24px;letter-spacing:.04em}
.story{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}.story .ph{aspect-ratio:4/3;background:var(--soft);display:grid;place-items:center;font-size:80px;border:1px solid var(--line)}
@media(max-width:700px){.story{grid-template-columns:1fr}}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:22px}.bar select,.bar input{border:1px solid var(--line);background:var(--card);padding:6px 10px;border-radius:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);cursor:pointer}.ph{display:grid;place-items:center;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover}
.card .ph{aspect-ratio:1;background:var(--soft);font-size:64px}.card .i{padding:12px 14px}.st{color:var(--acc);letter-spacing:2px}.mut{color:var(--mut);font-size:13px}
.rv{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.rv>div{border:1px solid var(--line);background:var(--card);padding:16px}
.ov{position:fixed;inset:0;background:#0007;z-index:20;display:none;justify-content:flex-end}.ov.c{justify-content:center;align-items:center}.ov.on{display:flex}
.pn{background:var(--bg);width:min(420px,100%);height:100%;overflow:auto;padding:24px}.ov.c .pn{height:auto;max-height:92%;width:min(560px,94%);border:1px solid var(--line)}
.pn label,section label{display:block;margin:10px 0 3px;font-size:13px;color:var(--mut)}
.pn input,.pn textarea,.pn select,section .w{width:100%;border:1px solid var(--line);background:var(--card);padding:8px 10px;border-radius:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.prog{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin:10px 0}.prog i{display:block;height:100%;background:var(--acc)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 22px;z-index:30;display:none;max-width:90%;text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.tabs .btn{opacity:.55}.tabs .btn.on{opacity:1}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}td,th{padding:8px;text-align:start;border-bottom:1px solid var(--line);font-size:14px}
footer{text-align:center;color:var(--mut);padding:30px;border-top:1px solid var(--line);font-size:13px}
</style></head>

function admin(){if(!isAdmin)return `<section class="s" style="max-width:420px"><h2>Admin login</h2>${sEmail?`<p>Signed in as <b>${esc(sEmail)}</b>, but this account is not an admin yet.${aErr?' (error: '+esc(aErr)+')':''} Run this in the Supabase SQL Editor, then reload:</p><p><code>insert into gb_admins select id from auth.users where email='${esc(sEmail)}';</code></p><p><button class="btn o sm" onclick="logout()">Sign out</button></p>`:''}<label>Email</label><input class="w" id="em" type="email" dir="ltr"><label>Password</label><input class="w" id="pw" type="password" dir="ltr"><p><button class="btn" onclick="login()">Sign in</button></p></section>`;
const T=['orders','products','reviews','content'];let b='';
if(tab=='orders')b=`<div class="tw"><table><tr><th>Customer</th><th>Phone</th><th>Mode</th><th>Total</th><th>Status</th></tr>${AD.o.map(o=>`<tr><td>${esc(o.first_name)} ${esc(o.last_name)}<br><span class="mut">${new Date(o.created_at).toLocaleString()}${o.address?'<br>'+esc(o.address):''}</span></td><td dir="ltr">${esc(o.phone)}</td><td>${o.mode}<br><span class="mut">COD${o.discount?' · loyalty −10%':''}</span></td><td>${Number(o.total).toFixed(2)} DT</td><td><select onchange="setSt('${o.id}',this.value)">${['pending','shipped','delivered','canceled'].map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan=5 class="mut">No orders yet.</td></tr>'}</table></div>`;
if(tab=='products')b=`<div class="tw"><table><tr><th>Product</th><th>Price</th><th>Stock</th><th>Image URL</th><th></th></tr>${AD.p.map(p=>`<tr><td>${esc(p.emoji)} ${esc(p.title)}</td><td><input type="number" value="${p.price}" style="width:80px" onchange="upP('${p.id}',{price:+this.value})"></td><td><input type="number" value="${p.stock}" style="width:70px" onchange="upP('${p.id}',{stock:+this.value})"></td><td><input value="${esc(p.image_url||'')}" placeholder="https://…" onchange="upP('${p.id}',{image_url:this.value.trim()||null})"></td><td><button class="btn o sm" onclick="trP('${p.id}')">FR / AR</button> <button class="btn o sm" onclick="delP('${p.id}')">Delete</button></td></tr>`).join('')}</table></div>
<h3 style="font-weight:400">Add product (English text, add FR/AR after)</h3><div class="bar"><input id="nt" placeholder="Title"><input id="np" type="number" placeholder="Price" style="width:90px"><input id="nc" placeholder="Category" style="width:120px"><input id="ns" type="number" placeholder="Stock" style="width:80px"><input id="nd" placeholder="Description"><button class="btn sm" onclick="addP()">Add</button></div>`;
if(tab=='reviews')b=AD.r.map(r=>`<div class="row"><span><span class="st">${stars(r.rating)}</span> ${esc(r.name)} on ${esc(pf(r.product_id)?.title||'?')}<br>${esc(r.comment)}</span><span>${r.approved?'<span class="mut">approved</span>':`<button class="btn sm" onclick="rv('${r.id}',1)">Approve</button>`} <button class="btn o sm" onclick="rv('${r.id}',0)">Delete</button></span></div>`).join('')||'<p class="mut">No reviews.</p>';
if(tab=='content')b='<p class="mut">English is the default; FR / AR fall back to English when left empty.</p>'+[['promo','Promo banner'],['hero_title','Hero title'],['hero_sub','Hero subtitle'],['story','Our Story']].map(([k,l])=>`<label>${l}</label>`+['','_fr','_ar'].map(s=>k=='story'?`<textarea class="w" rows="4" data-k="${k+s}" placeholder="${s||'EN'}" ${s=='_ar'?'dir="rtl"':''}>${esc(C[k+s])}</textarea>`:`<input class="w" data-k="${k+s}" placeholder="${s||'EN'}" value="${esc(C[k+s])}" ${s=='_ar'?'dir="rtl"':''}>`).join('')).join('')+`<p><button class="btn" onclick="saveC()">Save changes</button></p>`;
return `<section class="s"><h2>Admin dashboard <button class="btn o sm" onclick="logout()">Sign out</button></h2><div class="tabs">${T.map(x=>`<button class="btn ${x==tab?'on':''}" onclick="tab='${x}';render()">${x}</button>`).join('')}</div>${b}</section>`}
const ok=r=>{if(r.error){toast(r.error.message);return false}return true};
async function setSt(id,status){if(ok(await db.from('gb_orders').update({status}).eq('id',id)))toast('Status updated')}
async function upP(id,v){if(ok(await db.from('gb_products').update(v).eq('id',id)))toast('Saved')}
async function delP(id){if(confirm('Delete this product?')&&ok(await db.from('gb_products').delete().eq('id',id))){await load();aload()}}
function trP(id){const p=pf(id);ov(`<h2>${esc(p.title)}</h2>${[['title_fr','Title (FR)'],['description_fr','Description (FR)'],['title_ar','Title (AR)'],['description_ar','Description (AR)']].map(([k,l])=>`<label>${l}</label><input data-t="${k}" value="${esc(p[k])}" ${k.endsWith('ar')?'dir="rtl"':''}>`).join('')}<p><button class="btn" onclick="saveTr('${id}')">Save</button></p>`,1)}
async function saveTr(id){const v={};document.querySelectorAll('[data-t]').forEach(e=>v[e.dataset.t]=e.value.trim()||null);if(ok(await db.from('gb_products').update(v).eq('id',id))){closeOv();await load();aload()}}
async function addP(){const title=$('#nt').value.trim(),price=+$('#np').value;if(!title||!(price>=0))return toast('Title and price required');
if(ok(await db.from('gb_products').insert({title,price,category:$('#nc').value.trim()||'Other',stock:+$('#ns').value||0,description:$('#nd').value.trim()}))){await load();aload()}}
async function rv(id,yes){const r=yes?await db.from('gb_reviews').update({approved:true}).eq('id',id):await db.from('gb_reviews').delete().eq('id',id);if(ok(r)){await load();aload()}}
async function saveC(){const rows=[...document.querySelectorAll('[data-k]')].map(e=>({key:e.dataset.k,value:e.value}));if(ok(await db.from('gb_site_content').upsert(rows))){await load();toast('Content saved')}}
applyStatic();load();
function hashNav(){if(location.hash=='#admin')go('admin')}
addEventListener('hashchange',hashNav);hashNav();
</script></body></html>
